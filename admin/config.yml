backend:
  name: github
  repo: dadapoetry/adriansalcedo
  branch: main
  base_url: https://adriansalcedo.com
  auth_endpoint: api/auth
  commit_messages:
    create: "CMS: Create {{collection}} {{slug}}"
    update: "CMS: Update {{collection}} {{slug}}"
    delete: "CMS: Delete {{collection}} {{slug}}"
    uploadMedia: "CMS: Upload {{path}}"
    deleteMedia: "CMS: Delete {{path}}"

media_folder: "media/images"
public_folder: "/media/images"
locale: 'ca'

collections:
  - name: "site"
    label: "Configuració del lloc"
    label_singular: "Configuració"
    description: "Configuració global del lloc web (CA i EN)"
    files:
      - file: "content/site.json"
        label: "Configuració general (CA)"
        name: "site-config"
        fields: &siteFields
          - label: "Configuració del lloc"
            name: "site"
            widget: "object"
            fields:
              - { label: "Títol del lloc", name: "title", widget: "string" }
              - { label: "Descripció", name: "description", widget: "text" }
              - { label: "Idioma", name: "language", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "Idioma del lloc (locale)", name: "locale", widget: "string", required: false }
              - { label: "Logotip (URL)", name: "logo", widget: "string", required: false }
              - { label: "Favicon (URL)", name: "favicon", widget: "string", required: false }
              - { label: "Correu electrònic de contacte", name: "email", widget: "string", required: false }
              - { label: "CTA text (CA)", name: "cta", widget: "string", required: false }
              - { label: "CTA text (EN)", name: "cta_en", widget: "string", required: false }
          - label: "Navegació"
            name: "nav"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Etiqueta (CA)", name: "label", widget: "string" }
              - { label: "Etiqueta (EN)", name: "label_en", widget: "string" }
              - { label: "Títol SEO (CA)", name: "seo_title", widget: "string", required: false, hint: "Opcional. Si és buit, s’utilitza l’etiqueta del menú." }
              - { label: "SEO title (EN)", name: "seo_title_en", widget: "string", required: false, hint: "Optional. Falls back to the menu label." }
              - { label: "Camí", name: "path", widget: "string" }
          - label: "Xarxes socials"
            name: "social"
            widget: "object"
            fields: &socialFields
              - label: "Instagram"
                name: "instagram"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
              - label: "Twitter"
                name: "twitter"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
              - label: "YouTube"
                name: "youtube"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
              - label: "TikTok"
                name: "tiktok"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
              - label: "Goodreads"
                name: "goodreads"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
              - label: "Viquipèdia / Wikipedia"
                name: "wikipedia"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
              - label: "Wikidata"
                name: "wikidata"
                widget: "object"
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Etiqueta", name: "label", widget: "string", required: false }
                  - { label: "Icona", name: "icon", widget: "string", required: false }
      - file: "content/site.en.json"
        label: "Configuració general (EN)"
        name: "site-config-en"
        fields: *siteFields

  - name: "seo"
    label: "Descripcions SEO"
    label_singular: "Descripció SEO"
    description: "Meta description de cada secció (CA + EN): el text que veuen Google i les xarxes socials en cada pàgina."
    files:
      - file: "content/seo.json"
        label: "Descripcions per secció"
        name: "seo-sections"
        fields:
          - label: "Seccions"
            name: "sections"
            widget: "list"
            min: 1
            fields:
              - label: "Secció"
                name: "key"
                widget: "select"
                options:
                  - { label: "Obres", value: "obres" }
                  - { label: "Projectes", value: "projectes" }
                  - { label: "Festivals", value: "festivals" }
                  - { label: "Premis", value: "premis" }
                  - { label: "Premsa", value: "premsa" }
                  - { label: "Qui soc", value: "quisoc" }
                  - { label: "Contacte", value: "contacte" }
                  - { label: "Arxiu", value: "arxiu" }
                  - { label: "Agenda", value: "agenda" }
                  - { label: "Cerca", value: "cerca" }
              - { label: "Descripció (CA)", name: "desc", widget: "text" }
              - { label: "Description (EN)", name: "desc_en", widget: "text", required: false }

  - name: "inici"
    label: "Inici (Home)"
    description: "Pàgina d'inici editable (CA + EN)"
    files:
      - file: "content/home.json"
        label: "Pàgina d'inici"
        name: "home"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Títol (CA)", name: "title", widget: "string" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Subtítol (CA)", name: "subtitle", widget: "string" }
              - { label: "Subtitle (EN)", name: "subtitle_en", widget: "string" }
              - { label: "Declaració (CA)", name: "statement", widget: "text" }
              - { label: "Statement (EN)", name: "statement_en", widget: "text" }
              - { label: "Imatge", name: "image", widget: "image", required: false }
              - { label: "Alt text", name: "imageAlt", widget: "string", required: false }
          - label: "Obra destacada"
            name: "featuredWork"
            widget: "object"
            fields:
              - { label: "Títol (CA)", name: "title", widget: "string" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Tipus (CA)", name: "type", widget: "string" }
              - { label: "Type (EN)", name: "type_en", widget: "string" }
              - { label: "Editorial", name: "publisher", widget: "string" }
              - { label: "Any", name: "year", widget: "number", value_type: "int" }
              - { label: "Descripció (CA)", name: "description", widget: "text" }
              - { label: "Description (EN)", name: "description_en", widget: "text" }
              - { label: "Imatge", name: "image", widget: "image" }
              - { label: "Alt text (CA)", name: "imageAlt", widget: "string", required: false }
              - { label: "Alt text (EN)", name: "imageAlt_en", widget: "string", required: false }
              - { label: "Enllaç (CA)", name: "link", widget: "string" }
              - { label: "Link (EN)", name: "link_en", widget: "string" }
          - label: "Projectes destacats"
            name: "featuredProjects"
            widget: "list"
            fields:
              - { label: "Títol (CA)", name: "title", widget: "string" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Descripció (CA)", name: "description", widget: "text" }
              - { label: "Description (EN)", name: "description_en", widget: "text" }
              - { label: "Enllaç (CA)", name: "link", widget: "string" }
              - { label: "Link (EN)", name: "link_en", widget: "string" }
          - { label: "Bio curta (CA)", name: "bio", widget: "text" }
          - { label: "Short bio (EN)", name: "bio_en", widget: "text" }
          - { label: "Manifest (CA)", name: "manifesto", widget: "text", required: false }
          - { label: "Manifest (EN)", name: "manifesto_en", widget: "text", required: false }
          - label: "Projectes actuals (Now)"
            name: "currentProjects"
            widget: "list"
            required: false
            fields:
              - { label: "Títol (CA)", name: "title", widget: "string" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Descripció (CA)", name: "description", widget: "text" }
              - { label: "Description (EN)", name: "description_en", widget: "text" }
              - { label: "Estat (opcional)", name: "status", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Títol SEO (CA)", name: "title", widget: "string" }
              - { label: "SEO title (EN)", name: "title_en", widget: "string" }
              - { label: "Descripció SEO (CA)", name: "description", widget: "text" }
              - { label: "SEO description (EN)", name: "description_en", widget: "text" }

  - name: "projectes"
    label: "Projectes"
    label_singular: "Projecte"
    description: "Projectes poètics i editorials (CA + EN)"
    files:
      - file: "content/projectes.json"
        label: "Projectes"
        name: "projectes"
        fields:
          - label: "Projectes"
            name: "projects"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Títol", name: "title", widget: "string" }
              - { label: "ISSN", name: "issn", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Imatge", name: "image", widget: "image", required: false }
              - { label: "Alt text (CA)", name: "imageAlt", widget: "string", required: false }
              - { label: "Amplada imatge", name: "imageWidth", widget: "string", required: false }
              - { label: "Estat", name: "status", widget: "select", options: ["active", "inactive", "archived"], required: false }
              - { label: "Contingut (CA)", name: "content", widget: "list", field: { label: "Paràgraf", name: "paragraph", widget: "text" } }
              - { label: "Content (EN)", name: "content_en", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - &blocks_widget
                label: "Blocs de contingut (modular)"
                name: "blocks"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.type}}"
                types:
                  - label: "Encapçalament"
                    name: "heading"
                    fields:
                      - { label: "Text (CA)", name: "text", widget: "string" }
                      - { label: "Text (EN)", name: "text_en", widget: "string", required: false }
                  - label: "Prosa"
                    name: "prose"
                    fields:
                      - { label: "Paràgrafs (CA)", name: "text", widget: "list", field: { label: "Paràgraf", name: "p", widget: "text" } }
                      - { label: "Paragraphs (EN)", name: "text_en", widget: "list", field: { label: "Paragraph", name: "p", widget: "text" }, required: false }
                  - label: "Poema"
                    name: "poem"
                    fields:
                      - { label: "Versos (CA)", name: "lines", widget: "list", field: { label: "Vers", name: "line", widget: "string" } }
                      - { label: "Lines (EN)", name: "lines_en", widget: "list", field: { label: "Line", name: "line", widget: "string" }, required: false }
                  - label: "Cita"
                    name: "quote"
                    fields:
                      - { label: "Text (CA)", name: "text", widget: "text" }
                      - { label: "Text (EN)", name: "text_en", widget: "text", required: false }
                      - { label: "Autor/a", name: "author", widget: "string", required: false }
                      - { label: "Rol", name: "role", widget: "string", required: false }
                  - label: "Imatge"
                    name: "image"
                    fields:
                      - { label: "Fitxer", name: "src", widget: "image" }
                      - { label: "Alt (CA)", name: "alt", widget: "string", required: false }
                      - { label: "Alt (EN)", name: "alt_en", widget: "string", required: false }
                      - { label: "Amplada", name: "width", widget: "string", default: "100%", required: false }
                  - label: "Galeria"
                    name: "gallery"
                    fields:
                      - label: "Imatges"
                        name: "images"
                        widget: "list"
                        fields:
                          - { label: "Fitxer", name: "src", widget: "image" }
                          - { label: "Alt (CA)", name: "alt", widget: "string", required: false }
                          - { label: "Alt (EN)", name: "alt_en", widget: "string", required: false }
                          - { label: "Amplada", name: "width", widget: "string", default: "100%", required: false }
                  - label: "Vídeo"
                    name: "video"
                    fields:
                      - { label: "URL YouTube", name: "url", widget: "string" }
                      - { label: "Títol (CA)", name: "title", widget: "string", required: false }
                      - { label: "Títol (EN)", name: "title_en", widget: "string", required: false }
                  - label: "Àudio"
                    name: "audio"
                    fields:
                      - { label: "URL MP3", name: "url", widget: "string" }
                      - { label: "Títol", name: "title", widget: "string", required: false }
                  - label: "Enllaços"
                    name: "links"
                    fields:
                      - label: "Enllaços"
                        name: "items"
                        widget: "list"
                        fields:
                          - { label: "Etiqueta (CA)", name: "label", widget: "string" }
                          - { label: "Label (EN)", name: "label_en", widget: "string", required: false }
                          - { label: "URL", name: "url", widget: "string" }
                  - label: "Comprar"
                    name: "buy"
                    fields:
                      - label: "Llibreries"
                        name: "items"
                        widget: "list"
                        fields:
                          - { label: "Llibreria (CA)", name: "label", widget: "string" }
                          - { label: "Bookstore (EN)", name: "label_en", widget: "string", required: false }
                          - { label: "URL", name: "url", widget: "string" }
                  - label: "Llista"
                    name: "list"
                    fields:
                      - { label: "Elements (CA)", name: "items", widget: "list", field: { label: "Element", name: "item", widget: "text" } }
                      - { label: "Items (EN)", name: "items_en", widget: "list", field: { label: "Item", name: "item", widget: "text" }, required: false }
                  - label: "Metadades"
                    name: "meta"
                    fields:
                      - label: "Dades"
                        name: "items"
                        widget: "list"
                        fields:
                          - { label: "Etiqueta (CA)", name: "label", widget: "string" }
                          - { label: "Label (EN)", name: "label_en", widget: "string", required: false }
                          - { label: "Valor", name: "value", widget: "string" }
                  - label: "Crèdits"
                    name: "credits"
                    fields:
                      - { label: "Títol (CA)", name: "title", widget: "string", required: false }
                      - { label: "Title (EN)", name: "title_en", widget: "string", required: false }
                      - { label: "Persones / entitats", name: "items", widget: "list", field: { label: "Nom", name: "name", widget: "string" } }
              - label: "SEO"
                name: "seo"
                widget: "object"
                required: false
                fields:
                  - { label: "Títol SEO (CA)", name: "title", widget: "string", required: false }
                  - { label: "SEO title (EN)", name: "title_en", widget: "string", required: false }
                  - { label: "Descripció SEO (CA)", name: "description", widget: "text", required: false }
                  - { label: "SEO description (EN)", name: "description_en", widget: "text", required: false }

  - name: "festivals"
    label: "Festivals i actuacions"
    label_singular: "Festival"
    description: "Festivals, exposicions, recitals, intervencions i actuacions (CA + EN)"
    files:
      - file: "content/festivals.json"
        label: "Festivals"
        name: "festivals"
        fields:
          - { label: "Títol (CA)", name: "title", widget: "string", required: false }
          - { label: "Títol (EN)", name: "title_en", widget: "string", required: false }
          - label: "Festivals"
            name: "festivals"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Títol (CA)", name: "title", widget: "string" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Tipus", name: "label", widget: "select", options: ["recital", "exhibition", "intervention", "festival", "workshop", "lecture"], default: ["recital"] }
              - { label: "Any", name: "year", widget: "number", value_type: "int" }
              - { label: "Contingut (CA)", name: "content", widget: "list", field: { label: "Paràgraf", name: "paragraph", widget: "text" } }
              - { label: "Content (EN)", name: "content_en", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - { label: "Llista (CA)", name: "contentList", widget: "list", field: { label: "Element", name: "item", widget: "text" }, required: false }
              - { label: "List (EN)", name: "contentList_en", widget: "list", field: { label: "Item", name: "item", widget: "text" }, required: false }
              - label: "Imatges"
                name: "images"
                widget: "list"
                required: false
                fields:
                  - { label: "Fitxer", name: "src", widget: "image" }
                  - { label: "Alt text (CA)", name: "alt", widget: "string" }
                  - { label: "Alt text (EN)", name: "alt_en", widget: "string" }
                  - { label: "Amplada", name: "width", widget: "string", default: "100%" }
              - label: "Vídeos"
                name: "videos"
                widget: "list"
                required: false
                fields:
                  - { label: "URL YouTube", name: "url", widget: "string" }
                  - { label: "Títol (CA)", name: "title", widget: "string" }
                  - { label: "Title (EN)", name: "title_en", widget: "string" }
              - *blocks_widget
              - label: "SEO"
                name: "seo"
                widget: "object"
                required: false
                fields:
                  - { label: "Títol SEO (CA)", name: "title", widget: "string", required: false }
                  - { label: "SEO title (EN)", name: "title_en", widget: "string", required: false }
                  - { label: "Descripció SEO (CA)", name: "description", widget: "text", required: false }
                  - { label: "SEO description (EN)", name: "description_en", widget: "text", required: false }

  - name: "obres"
    label: "Obres"
    label_singular: "Obra"
    description: "Obres i videopoemes (CA + EN)"
    files:
      - file: "content/obres.json"
        label: "Obres"
        name: "obres"
        fields:
          - label: "Obres"
            name: "works"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Títol", name: "title", widget: "string" }
              - { label: "Tipus", name: "type", widget: "select", options: ["publication", "videopoem", "installation", "digital"] }
              - { label: "Any", name: "year", widget: "number", value_type: "int", required: false }
              - { label: "Editorial", name: "publisher", widget: "string", required: false }
              - { label: "ISBN", name: "isbn", widget: "string", required: false }
              - { label: "Contingut (CA)", name: "content", widget: "list", field: { label: "Paràgraf", name: "paragraph", widget: "text" }, required: false }
              - { label: "Content (EN)", name: "content_en", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" }, required: false }
              - label: "Imatges"
                name: "images"
                widget: "list"
                required: false
                fields:
                  - { label: "Fitxer", name: "src", widget: "image" }
                  - { label: "Alt text (CA)", name: "alt", widget: "string", required: false }
                  - { label: "Alt text (EN)", name: "alt_en", widget: "string", required: false }
                  - { label: "Amplada", name: "width", widget: "string", default: "100%", required: false }
              - label: "Vídeos"
                name: "videos"
                widget: "list"
                required: false
                fields:
                  - { label: "URL YouTube", name: "url", widget: "string" }
                  - { label: "Títol", name: "title", widget: "string" }
              - label: "Recepció crítica (cites)"
                name: "reviews"
                widget: "list"
                required: false
                fields:
                  - { label: "Text de la cita", name: "text", widget: "text" }
                  - { label: "Autor/a", name: "author", widget: "string" }
                  - { label: "Rol / mitjà", name: "role", widget: "string", required: false }
              - label: "Col·laboradors / crèdits"
                name: "contributors"
                widget: "list"
                required: false
                field: { label: "Nom", name: "name", widget: "string" }
              - *blocks_widget
              - label: "Llegeix-ne més"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Etiqueta (CA)", name: "label", widget: "string" }
                  - { label: "Label (EN)", name: "label_en", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string" }
              - label: "Llibreries en línia (On comprar-lo)"
                name: "buyLinks"
                widget: "list"
                required: false
                fields:
                  - { label: "Llibreria (CA)", name: "label", widget: "string" }
                  - { label: "Bookstore (EN)", name: "label_en", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string" }
              - { label: "Posició de la imatge", name: "image_position", widget: "select", options: ["bottom", "middle", "top"], default: "bottom", required: false }
              - { label: "Posició dels vídeos", name: "videos_position", widget: "select", options: ["bottom", "middle", "top"], default: "bottom", required: false }
              - label: "SEO"
                name: "seo"
                widget: "object"
                required: false
                fields:
                  - { label: "Títol SEO (CA)", name: "title", widget: "string", required: false }
                  - { label: "SEO title (EN)", name: "title_en", widget: "string", required: false }
                  - { label: "Descripció SEO (CA)", name: "description", widget: "text", required: false }
                  - { label: "SEO description (EN)", name: "description_en", widget: "text", required: false }

  - name: "premis"
    label: "Premis"
    description: "Premis i reconeixements (CA + EN)"
    files:
      - file: "content/premis.json"
        label: "Premis"
        name: "premis"
        fields:
          - label: "Premis"
            name: "awards"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Títol (CA)", name: "title", widget: "string" }
              - { label: "Title (EN)", name: "title_en", widget: "string" }
              - { label: "Any", name: "year", widget: "number", value_type: "int" }
              - { label: "Categoria", name: "category", widget: "string" }
              - { label: "Contingut (CA)", name: "content", widget: "list", field: { label: "Paràgraf", name: "paragraph", widget: "text" } }
